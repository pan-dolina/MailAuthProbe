name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Test
        run: go test ./...

      - name: Verify dependencies
        run: scripts/check-dependencies.sh

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/build-release.sh

      - name: Verify the build is reproducible
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/verify-reproducible.sh

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate SBOMs
        run: |
          scripts/sbom.sh dist
          mkdir -p "$RUNNER_TEMP/extract"
          for archive in dist/*.tar.gz dist/*.zip; do
            name="$(basename "$archive")"
            name="${name%.tar.gz}"
            name="${name%.zip}"
            dir="$RUNNER_TEMP/extract/$name"
            mkdir -p "$dir"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$dir" ;;
              *) tar -xzf "$archive" -C "$dir" ;;
            esac
            bin="$(find "$dir" -name 'mailauthprobe*' -type f | head -1)"
            SBOM_NAME="$name" scripts/sbom.sh dist "$bin"
          done
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux_amd64
          - runner: ubuntu-24.04-arm
            artifact: linux_arm64
          - runner: macos-latest
            artifact: darwin_arm64
          - runner: windows-latest
            artifact: windows_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Verify checksum and extract
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ github.ref_name }}
        run: |
          cd dist
          name="mailauthprobe_${VERSION#v}_${ARTIFACT}"
          if [ -f "$name.zip" ]; then archive="$name.zip"; else archive="$name.tar.gz"; fi
          grep " $archive\$" SHA256SUMS > expected.sum
          if command -v sha256sum >/dev/null; then sha256sum -c expected.sum; else shasum -a 256 -c expected.sum; fi
          mkdir -p smoke
          case "$archive" in
            *.zip) unzip -q "$archive" -d smoke ;;
            *) tar -xzf "$archive" -C smoke ;;
          esac

      - name: Smoke test release binary
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bin="$PWD/dist/smoke/mailauthprobe"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          MAILAUTHPROBE_BIN="$bin" MAILAUTHPROBE_EXPECT_VERSION="$VERSION" go test -tags smoke -count=1 ./test/smoke

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # OIDC token for Sigstore keyless signing and attestations
      attestations: write # store build provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums and archives (keyless)
        run: |
          cd dist
          for f in SHA256SUMS *.tar.gz *.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat >> release-notes.md <<'NOTES'

          ## Verifying this release

          See [docs/release-verification.md](https://github.com/marcindolinski/mailauthprobe/blob/main/docs/release-verification.md).
          NOTES
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "MailAuthProbe $TAG" --notes-file release-notes.md $prerelease
